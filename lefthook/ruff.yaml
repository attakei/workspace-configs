---
# Run Ruff as formatter and linter
#
# When you include this file, lefthook runs ruff as formatter and linter on pre-commit.
# To use this, you must be that venv of `run_pyhton` is installed `ruff`.
#
# Variables:
# - run_python: Command to python script entrypoint.
# ------
min_version: 1.10.8

pre-commit:
  parallel: true
  jobs:
    - name: 'Ruff'
      glob: '*.py'
      group:
        parallel: false
        jobs:
          - name: 'format'
            run: '{run_python} ruff format {staged_files}'
            stage_fixed: true
          - name: 'lint'
            run: '{run_python} ruff check --fix {staged_files}'
            stage_fixed: true
