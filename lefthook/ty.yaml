---
# Run ty as Hooks for Python project to use all Astral tools.
#
# When you include this file, lefthook runs ty as type checker on pre-commit.
# To use this, you must be that venv of `run_pyhton` is installed `ty`.
#
# Variables:
# - run_python: Command to python script entrypoint.
# ------
min_version: 1.10.8

pre-commit:
  parallel: true
  commands:
    ty:
      glob: '*.py'
      run: '{run_python} ty check {staged_files}'
